[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "multiparserag"
version = "0.0.1"
description = "MinerU document ingestion, MinIO assets, and source-backed RAG context."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx[socks]>=0.28,<0.29",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "minio==7.2.20",
  "markdown-it-py>=3,<5",
  "pillow>=11.3,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
multiparserag = "multiparserag.main:run"
multiparserag-init-storage = "multiparserag.adapters.storage:bootstrap"

[tool.hatch.build.targets.wheel]
packages = ["src/multiparserag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
